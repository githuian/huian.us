<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>huian.us</title>
<meta name="description" content="A small collection of single-purpose apps." />
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --panel-2: #1e2229;
    --border: #2a2f3a;
    --text: #e8eaed;
    --muted: #9aa3b2;
    --accent: #5b9dff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg: #f5f6f8;
      --panel: #ffffff;
      --panel-2: #f0f1f4;
      --border: #e1e4ea;
      --text: #1a1d23;
      --muted: #5f6673;
      --accent: #2f6fed;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    display: flex;
    justify-content: center;
    padding: 48px 16px;
  }
  .wrap { width: 100%; max-width: 560px; }
  h1 {
    font-size: 1.6rem;
    margin: 0 0 8px;
  }
  .sub {
    color: var(--muted);
    font-size: 0.95rem;
    margin: 0 0 28px;
  }
  .apps {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .app-card {
    display: flex;
    align-items: center;
    gap: 14px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 16px 18px;
    text-decoration: none;
    color: var(--text);
    transition: border-color .15s ease, transform .05s ease;
  }
  .app-card:hover { border-color: var(--accent); }
  .app-card:active { transform: scale(0.99); }
  .app-icon {
    font-size: 1.6rem;
    width: 44px;
    height: 44px;
    flex: none;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--panel-2);
    border-radius: 10px;
  }
  .app-info h2 {
    font-size: 1.05rem;
    margin: 0 0 2px;
  }
  .app-info p {
    margin: 0;
    font-size: 0.85rem;
    color: var(--muted);
  }
  .arrow {
    margin-left: auto;
    color: var(--muted);
    flex: none;
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>huian.us</h1>
  <p class="sub">A small collection of single-purpose apps.</p>

  <div class="apps">
    <a class="app-card" href="/apps/ClipShare/">
      <span class="app-icon">📋</span>
      <span class="app-info">
        <h2>ClipShare</h2>
        <p>One shared clipboard, synced across every device.</p>
      </span>
      <span class="arrow">&rarr;</span>
    </a>

    <a class="app-card" href="/apps/DisplayBoard/">
      <span class="app-icon">🖥️</span>
      <span class="app-info">
        <h2>Display Board</h2>
        <p>Type a message, show it fullscreen and huge on any screen.</p>
      </span>
      <span class="arrow">&rarr;</span>
    </a>
  </div>
</div>
</body>
</html>
