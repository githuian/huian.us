<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>My GitHub Notepad</title>
  <style>
    body { margin: 0; font-family: sans-serif; background: #1e1e1e; color: #fff; }
    textarea {
      width: 100vw; height: 100vh; border: none; padding: 20px;
      box-sizing: border-box; background: transparent; color: inherit;
      font-size: 16px; outline: none; resize: none;
    }
  </style>
</head>
<body>
  <textarea id="pad" placeholder="Type your notes here..."></textarea>
  <script>
    const pad = document.getElementById('pad');
    pad.value = localStorage.getItem('my_note') || '';
    pad.addEventListener('input', () => {
      localStorage.setItem('my_note', pad.value);
    });
  </script>
</body>
</html>
