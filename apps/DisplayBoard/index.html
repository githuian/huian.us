<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Remote Display Board</title>
  <style>
    body {
      margin: 0;
      background-color: #000;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
      box-sizing: border-box;
    }
    .text {
      font-size: 8vw;
      font-weight: 800;
      line-height: 1.1;
      word-break: break-word;
    }
  </style>
</head>
<body>

  <div class="text" id="display">Loading...</div>

<script>
  async function fetchRemoteText() {
    try {
      // Fetches a text file from your repo (add timestamp parameter to prevent browser caching)
      const response = await fetch('status.txt?t=' + Date.now());
      if (response.ok) {
        const text = await response.text();
        document.getElementById('display').innerText = text.trim() || 'NO MESSAGE';
      }
    } catch (e) {
      console.error('Fetch failed', e);
    }
  }

  // Poll for updates every 5 seconds
  setInterval(fetchRemoteText, 5000);
  fetchRemoteText();
</script>

</body>
</html>
