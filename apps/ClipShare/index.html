<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>ClipShare</title>
<meta name="description" content="One shared clipboard. Type on one device, read it on another." />
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📋</text></svg>" />
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --panel-2: #1e2229;
    --border: #2a2f3a;
    --text: #e8eaed;
    --muted: #9aa3b2;
    --accent: #5b9dff;
    --accent-2: #34d399;
    --danger: #f97066;
    --radius: 14px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg: #f5f6f8;
      --panel: #ffffff;
      --panel-2: #f0f1f4;
      --border: #e1e4ea;
      --text: #1a1d23;
      --muted: #5f6673;
      --accent: #2f6fed;
      --accent-2: #0f9d68;
      --danger: #d9362b;
    }
  }
  :root[data-theme="light"] {
    --bg: #f5f6f8;
    --panel: #ffffff;
    --panel-2: #f0f1f4;
    --border: #e1e4ea;
    --text: #1a1d23;
    --muted: #5f6673;
    --accent: #2f6fed;
    --accent-2: #0f9d68;
    --danger: #d9362b;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    display: flex;
    justify-content: center;
    padding: 24px 16px 48px;
  }
  .wrap { width: 100%; max-width: 720px; }
  header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 18px; flex-wrap: wrap; }
  h1 { font-size: 1.4rem; margin: 0; display: flex; align-items: center; gap: 8px; }
  h1 .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--danger); display: inline-block; transition: background .2s; }
  h1 .dot.connected { background: var(--accent-2); }
  .sub { color: var(--muted); font-size: 0.85rem; }
  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 18px;
    margin-bottom: 16px;
  }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  textarea {
    width: 100%;
    min-height: 260px;
    resize: vertical;
    background: var(--panel-2);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px;
    font-size: 1rem;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    line-height: 1.5;
  }
  textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  button {
    font-size: 0.95rem;
    border-radius: 10px;
    border: 1px solid var(--border);
    padding: 10px 14px;
    background: var(--panel-2);
    color: var(--text);
    cursor: pointer;
    font-weight: 600;
    transition: transform .05s ease, opacity .15s ease;
  }
  button:active { transform: scale(0.97); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.ghost:hover { border-color: var(--accent); }
  .muted { color: var(--muted); font-size: 0.85rem; }
  .toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(20px);
    background: var(--panel-2); border: 1px solid var(--border); color: var(--text);
    padding: 10px 18px; border-radius: 999px; font-size: 0.9rem; opacity: 0;
    transition: opacity .25s ease, transform .25s ease; pointer-events: none;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  a { color: var(--accent); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1><span id="statusDot" class="dot"></span> ClipShare</h1>
    <span class="sub" id="statusText">connecting…</span>
  </header>

  <div class="card">
    <textarea id="clipboard" placeholder="Type or paste (Cmd/Ctrl+V) here. It syncs to this same page on every device."></textarea>
    <div class="row" style="margin-top:12px">
      <button id="copyBtn" class="primary">Copy to my clipboard</button>
      <button id="pasteBtn" class="ghost">Paste from my clipboard</button>
      <button id="clearBtn" class="ghost">Clear</button>
    </div>
  </div>

  <p class="muted">
    This is one shared board — everyone who opens this page sees and can edit the same text.
    It's stored so it's still here when you come back, on any device.
  </p>
</div>

<div class="toast" id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
<script>
(function () {
  const firebaseConfig = {
    apiKey: "AIzaSyCfXjsPDs3cSRN1GbS8iDy0zOxR8sCkNH4",
    authDomain: "mycp-558e0.firebaseapp.com",
    databaseURL: "https://mycp-558e0-default-rtdb.firebaseio.com",
    projectId: "mycp-558e0",
    storageBucket: "mycp-558e0.firebasestorage.app",
    messagingSenderId: "852453665959",
    appId: "1:852453665959:web:b73708fd83577e48a07f82"
  };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();
  const boardRef = db.ref("clipshare/text");
  const connectedRef = db.ref(".info/connected");

  const el = (id) => document.getElementById(id);
  const statusDot = el("statusDot");
  const statusText = el("statusText");
  const clipboard = el("clipboard");
  const copyBtn = el("copyBtn");
  const pasteBtn = el("pasteBtn");
  const clearBtn = el("clearBtn");
  const toastEl = el("toast");

  let debounceTimer = null;
  let lastLocalEditAt = 0;
  let lastWrittenValue = null;

  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add("show");
    clearTimeout(toast._t);
    toast._t = setTimeout(() => toastEl.classList.remove("show"), 1800);
  }

  connectedRef.on("value", (snap) => {
    const connected = snap.val() === true;
    statusDot.classList.toggle("connected", connected);
    statusText.textContent = connected ? "synced" : "connecting…";
  });

  boardRef.on("value", (snap) => {
    const val = snap.val() || "";
    if (val === lastWrittenValue) return;
    // Don't clobber text the user is actively typing right now.
    if (document.activeElement === clipboard && Date.now() - lastLocalEditAt < 1500) return;
    clipboard.value = val;
    lastWrittenValue = val;
  });

  function writeValue(value) {
    lastWrittenValue = value;
    boardRef.set(value);
  }

  clipboard.addEventListener("input", () => {
    lastLocalEditAt = Date.now();
    clearTimeout(debounceTimer);
    debounceTimer = setTimeout(() => writeValue(clipboard.value), 250);
  });

  copyBtn.addEventListener("click", async () => {
    try {
      await navigator.clipboard.writeText(clipboard.value);
      toast("Copied to clipboard");
    } catch (e) {
      toast("Couldn't access clipboard — select the text and copy manually");
    }
  });

  pasteBtn.addEventListener("click", async () => {
    try {
      const text = await navigator.clipboard.readText();
      clipboard.value = text;
      lastLocalEditAt = Date.now();
      writeValue(text);
      toast("Pasted and saved");
    } catch (e) {
      toast("Couldn't read clipboard — paste manually with Cmd/Ctrl+V");
    }
  });

  clearBtn.addEventListener("click", () => {
    clipboard.value = "";
    lastLocalEditAt = Date.now();
    writeValue("");
    clipboard.focus();
  });
})();
</script>
</body>
</html>
