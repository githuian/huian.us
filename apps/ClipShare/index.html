<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>ClipShare</title>
<meta name="description" content="One shared clipboard. Type on one device, read it on another." />
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📋</text></svg>" />
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --panel-2: #1e2229;
    --border: #2a2f3a;
    --text: #e8eaed;
    --muted: #9aa3b2;
    --accent: #5b9dff;
    --accent-2: #34d399;
    --danger: #f97066;
    --radius: 14px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg: #f5f6f8;
      --panel: #ffffff;
      --panel-2: #f0f1f4;
      --border: #e1e4ea;
      --text: #1a1d23;
      --muted: #5f6673;
      --accent: #2f6fed;
      --accent-2: #0f9d68;
      --danger: #d9362b;
    }
  }
  :root[data-theme="light"] {
    --bg: #f5f6f8;
    --panel: #ffffff;
    --panel-2: #f0f1f4;
    --border: #e1e4ea;
    --text: #1a1d23;
    --muted: #5f6673;
    --accent: #2f6fed;
    --accent-2: #0f9d68;
    --danger: #d9362b;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    display: flex;
    justify-content: center;
    padding: 24px 16px 48px;
  }
  .wrap { width: 100%; max-width: 720px; }
  header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 18px; flex-wrap: wrap; }
  h1 { font-size: 1.4rem; margin: 0; display: flex; align-items: center; gap: 8px; }
  h1 .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--danger); display: inline-block; transition: background .2s; }
  h1 .dot.connected { background: var(--accent-2); }
  .sub { color: var(--muted); font-size: 0.85rem; }
  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 18px;
    margin-bottom: 16px;
  }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  textarea {
    width: 100%;
    min-height: 260px;
    resize: vertical;
    background: var(--panel-2);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px;
    font-size: 1rem;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    line-height: 1.5;
  }
  textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  button {
    font-size: 0.95rem;
    border-radius: 10px;
    border: 1px solid var(--border);
    padding: 10px 14px;
    min-height: 44px;
    background: var(--panel-2);
    color: var(--text);
    cursor: pointer;
    font-weight: 600;
    transition: transform .05s ease, opacity .15s ease;
  }
  button:active { transform: scale(0.97); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.ghost:hover { border-color: var(--accent); }
  .muted { color: var(--muted); font-size: 0.85rem; }

  .dropzone {
    border: 2px dashed var(--border);
    border-radius: 12px;
    padding: 22px 16px;
    text-align: center;
    color: var(--muted);
    cursor: pointer;
    transition: border-color .15s ease, background .15s ease;
  }
  .dropzone:hover, .dropzone:focus-visible { border-color: var(--accent); }
  .dropzone.drag { border-color: var(--accent); background: var(--panel-2); color: var(--text); }
  .dropzone .hint { font-size: 0.8rem; margin-top: 4px; }

  .progress {
    position: relative;
    height: 6px;
    border-radius: 999px;
    background: var(--panel-2);
    overflow: hidden;
    margin-top: 10px;
  }
  .progress-bar {
    position: absolute;
    top: 0; bottom: 0;
    width: 40%;
    background: var(--accent);
    border-radius: 999px;
    animation: indeterminate 1.1s infinite ease-in-out;
  }
  @keyframes indeterminate {
    0% { left: -40%; }
    100% { left: 100%; }
  }
  .upload-row { display: flex; justify-content: space-between; gap: 8px; font-size: 0.8rem; color: var(--muted); margin-top: 6px; }

  .file-list { list-style: none; margin: 14px 0 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
  .file-item {
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 12px;
  }
  .file-icon { font-size: 1.4rem; flex-shrink: 0; }
  .file-meta { flex: 1 1 auto; min-width: 0; }
  .file-name {
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .file-sub { font-size: 0.78rem; color: var(--muted); }
  .file-actions { display: flex; gap: 6px; flex-shrink: 0; }
  .file-actions button { padding: 8px 10px; min-height: 38px; font-size: 0.85rem; }
  .icon-btn.danger:hover { border-color: var(--danger); color: var(--danger); }

  @media (max-width: 480px) {
    .row > button { flex: 1 1 auto; }
    .file-item { flex-wrap: wrap; }
    .file-actions { width: 100%; justify-content: flex-end; }
  }
  .toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(20px);
    background: var(--panel-2); border: 1px solid var(--border); color: var(--text);
    padding: 10px 18px; border-radius: 999px; font-size: 0.9rem; opacity: 0;
    transition: opacity .25s ease, transform .25s ease; pointer-events: none;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  a { color: var(--accent); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1><span id="statusDot" class="dot"></span> ClipShare</h1>
    <span class="sub" id="statusText">connecting…</span>
  </header>

  <div class="card">
    <textarea id="clipboard" placeholder="Type or paste (Cmd/Ctrl+V) here. It syncs to this same page on every device."></textarea>
    <div class="row" style="margin-top:12px">
      <button id="copyBtn" class="primary">Copy to my clipboard</button>
      <button id="pasteBtn" class="ghost">Paste from my clipboard</button>
      <button id="clearBtn" class="ghost">Clear</button>
    </div>
  </div>

  <div class="card">
    <div class="dropzone" id="dropZone" tabindex="0" role="button" aria-label="Choose or drop a file to share">
      <div>📎 Tap to choose a file, or drop it here</div>
      <div class="hint">Shared with everyone who has this link · up to 50 MB</div>
    </div>
    <input type="file" id="fileInput" multiple hidden />
    <div id="uploadStatus" style="display:none">
      <div class="progress"><div class="progress-bar"></div></div>
      <div class="upload-row"><span id="uploadName"></span><span>Uploading…</span></div>
    </div>
    <ul class="file-list" id="fileList"></ul>
  </div>

  <p class="muted">
    This is one shared board — everyone who opens this page sees and can edit the same text and files.
    It's stored so it's still here when you come back, on any device.
  </p>
</div>

<div class="toast" id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function () {
  const firebaseConfig = {
    apiKey: "AIzaSyCfXjsPDs3cSRN1GbS8iDy0zOxR8sCkNH4",
    authDomain: "mycp-558e0.firebaseapp.com",
    databaseURL: "https://mycp-558e0-default-rtdb.firebaseio.com",
    projectId: "mycp-558e0",
    storageBucket: "mycp-558e0.firebasestorage.app",
    messagingSenderId: "852453665959",
    appId: "1:852453665959:web:b73708fd83577e48a07f82"
  };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();
  const boardRef = db.ref("clipshare/text");
  const filesRef = db.ref("clipshare/files");
  const connectedRef = db.ref(".info/connected");

  // Files themselves live in Supabase Storage (free tier); only their
  // metadata (name/size/url) lives in the Firebase Realtime Database above.
  const SUPABASE_URL = "https://uokpjmdtqymymxssxscj.supabase.co";
  const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_vyO4OGo6YyjU4GlRKC9Z-Q_6kuZLC3h";
  const SUPABASE_BUCKET = "clipshare";
  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

  const MAX_FILE_BYTES = 50 * 1024 * 1024;

  const el = (id) => document.getElementById(id);
  const statusDot = el("statusDot");
  const statusText = el("statusText");
  const clipboard = el("clipboard");
  const copyBtn = el("copyBtn");
  const pasteBtn = el("pasteBtn");
  const clearBtn = el("clearBtn");
  const toastEl = el("toast");
  const dropZone = el("dropZone");
  const fileInput = el("fileInput");
  const fileList = el("fileList");
  const uploadStatus = el("uploadStatus");
  const uploadName = el("uploadName");

  let debounceTimer = null;
  let lastLocalEditAt = 0;
  let lastWrittenValue = null;

  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add("show");
    clearTimeout(toast._t);
    toast._t = setTimeout(() => toastEl.classList.remove("show"), 1800);
  }

  connectedRef.on("value", (snap) => {
    const connected = snap.val() === true;
    statusDot.classList.toggle("connected", connected);
    statusText.textContent = connected ? "synced" : "connecting…";
  });

  boardRef.on("value", (snap) => {
    const val = snap.val() || "";
    if (val === lastWrittenValue) return;
    // Don't clobber text the user is actively typing right now.
    if (document.activeElement === clipboard && Date.now() - lastLocalEditAt < 1500) return;
    clipboard.value = val;
    lastWrittenValue = val;
  });

  function writeValue(value) {
    lastWrittenValue = value;
    boardRef.set(value);
  }

  clipboard.addEventListener("input", () => {
    lastLocalEditAt = Date.now();
    clearTimeout(debounceTimer);
    debounceTimer = setTimeout(() => writeValue(clipboard.value), 250);
  });

  copyBtn.addEventListener("click", async () => {
    try {
      await navigator.clipboard.writeText(clipboard.value);
      toast("Copied to clipboard");
    } catch (e) {
      toast("Couldn't access clipboard — select the text and copy manually");
    }
  });

  pasteBtn.addEventListener("click", async () => {
    try {
      const text = await navigator.clipboard.readText();
      clipboard.value = text;
      lastLocalEditAt = Date.now();
      writeValue(text);
      toast("Pasted and saved");
    } catch (e) {
      toast("Couldn't read clipboard — paste manually with Cmd/Ctrl+V");
    }
  });

  clearBtn.addEventListener("click", () => {
    clipboard.value = "";
    lastLocalEditAt = Date.now();
    writeValue("");
    clipboard.focus();
  });

  // ---- File sharing ----

  function formatSize(bytes) {
    if (bytes < 1024) return bytes + " B";
    if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + " KB";
    return (bytes / (1024 * 1024)).toFixed(1) + " MB";
  }

  function fileIcon(type) {
    if (!type) return "📄";
    if (type.startsWith("image/")) return "🖼️";
    if (type.startsWith("video/")) return "🎬";
    if (type.startsWith("audio/")) return "🎵";
    if (type === "application/pdf") return "📕";
    if (type.includes("zip") || type.includes("compressed")) return "🗜️";
    return "📄";
  }

  function renderFiles(entries) {
    fileList.innerHTML = "";
    entries
      .sort((a, b) => (b.uploadedAt || 0) - (a.uploadedAt || 0))
      .forEach(({ id, data }) => {
        const li = document.createElement("li");
        li.className = "file-item";

        const icon = document.createElement("span");
        icon.className = "file-icon";
        icon.textContent = fileIcon(data.type);

        const meta = document.createElement("div");
        meta.className = "file-meta";
        const name = document.createElement("div");
        name.className = "file-name";
        name.textContent = data.name;
        const sub = document.createElement("div");
        sub.className = "file-sub";
        sub.textContent = formatSize(data.size || 0);
        meta.appendChild(name);
        meta.appendChild(sub);

        const actions = document.createElement("div");
        actions.className = "file-actions";

        const downloadBtn = document.createElement("button");
        downloadBtn.className = "ghost icon-btn";
        downloadBtn.textContent = "Download";
        downloadBtn.addEventListener("click", () => {
          const a = document.createElement("a");
          a.href = data.url;
          a.download = data.name;
          a.target = "_blank";
          a.rel = "noopener";
          document.body.appendChild(a);
          a.click();
          a.remove();
        });

        const deleteBtn = document.createElement("button");
        deleteBtn.className = "ghost icon-btn danger";
        deleteBtn.textContent = "✕";
        deleteBtn.title = "Remove for everyone";
        deleteBtn.addEventListener("click", () => deleteFile(id, data));

        actions.appendChild(downloadBtn);
        actions.appendChild(deleteBtn);

        li.appendChild(icon);
        li.appendChild(meta);
        li.appendChild(actions);
        fileList.appendChild(li);
      });
  }

  filesRef.on("value", (snap) => {
    const val = snap.val() || {};
    renderFiles(Object.keys(val).map((id) => ({ id, data: val[id] })));
  });

  async function deleteFile(id, data) {
    try {
      if (data.storagePath) {
        await sb.storage.from(SUPABASE_BUCKET).remove([data.storagePath]);
      }
      await filesRef.child(id).remove();
      toast("File removed");
    } catch (e) {
      toast("Couldn't remove file");
    }
  }

  async function uploadFile(file) {
    if (file.size > MAX_FILE_BYTES) {
      toast(`"${file.name}" is over the 50 MB limit`);
      return;
    }
    const id = filesRef.push().key;
    const storagePath = `${id}-${file.name}`;

    uploadStatus.style.display = "block";
    uploadName.textContent = file.name;

    const { error } = await sb.storage
      .from(SUPABASE_BUCKET)
      .upload(storagePath, file, { contentType: file.type || undefined, upsert: false });

    if (error) {
      toast(`Couldn't upload "${file.name}"`);
      uploadStatus.style.display = "none";
      return;
    }

    const { data: pub } = sb.storage.from(SUPABASE_BUCKET).getPublicUrl(storagePath);
    await filesRef.child(id).set({
      name: file.name,
      size: file.size,
      type: file.type || "",
      url: pub.publicUrl,
      storagePath,
      uploadedAt: firebase.database.ServerValue.TIMESTAMP,
    });
    uploadStatus.style.display = "none";
    toast(`Shared "${file.name}"`);
  }

  function handleFiles(fileListLike) {
    Array.from(fileListLike || []).forEach((file) => {
      uploadFile(file);
    });
  }

  dropZone.addEventListener("click", () => fileInput.click());
  dropZone.addEventListener("keydown", (e) => {
    if (e.key === "Enter" || e.key === " ") {
      e.preventDefault();
      fileInput.click();
    }
  });
  fileInput.addEventListener("change", () => {
    handleFiles(fileInput.files);
    fileInput.value = "";
  });

  ["dragenter", "dragover"].forEach((evt) =>
    dropZone.addEventListener(evt, (e) => {
      e.preventDefault();
      dropZone.classList.add("drag");
    })
  );
  ["dragleave", "drop"].forEach((evt) =>
    dropZone.addEventListener(evt, (e) => {
      e.preventDefault();
      dropZone.classList.remove("drag");
    })
  );
  dropZone.addEventListener("drop", (e) => {
    handleFiles(e.dataTransfer && e.dataTransfer.files);
  });
})();
</script>
</body>
</html>
